<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlazeClaw Dashboard - Skills</title>
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./dashboard-host.css" />
</head>
<body class="blazeclaw-dashboard-host">
    <div class="app dashboard-app">
        <div id="agentsControlPlane" class="agents-control-plane">
            <div id="agentsSurface" class="agents-surface"></div>
        </div>
        <div id="approvalQueue" class="approval-queue" hidden></div>
        <div id="messages" class="messages" hidden></div>
        <div id="detachedNotices" class="detached-notices" hidden></div>
        <div id="speechLivePreview" class="speech-live-preview" hidden>
            <span class="speech-live-preview-label"></span>
            <span class="speech-live-preview-text"></span>
        </div>
        <div class="composer dashboard-composer" hidden>
            <div id="slashMenu" class="slash-menu"></div>
            <textarea id="input" placeholder="Type a message..." hidden></textarea>
            <button id="sendBtn" hidden>Send</button>
            <button id="sendErrBtn" hidden>Send Error</button>
            <button id="attachBtn" hidden>Attach</button>
            <button id="speechTranscribeBtn" hidden>Transcribe</button>
            <button id="abortBtn" hidden disabled>Abort</button>
        </div>

    </div>

    <script>
        window.__BLAZECLAW_DASHBOARD_HOST__ = true;
        window.__BLAZECLAW_DASHBOARD_PANEL__ = "skills";
        window.__BLAZECLAW_DASHBOARD_PANEL_FIXED__ = true;
    </script>
    <script src="./scope-errors.js"></script>
    <script src="./channels-state-contract.js"></script>
    <script src="./config-form-coerce.js"></script>
    <script src="./config-form-utils.js"></script>
    <script src="./controller-utils.js"></script>
    <script src="./dashboard-host-bootstrap.js"></script>
    <script src="./skills-controller.js"></script>
    <script src="./agents-controller.js"></script>
    <script src="./chat-controller.js"></script>
    <script src="./index.js"></script>
</body>
</html>

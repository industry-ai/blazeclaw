<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlazeClaw Chat</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #1e1e1e;
      color: #f0f0f0;
    }
    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }
    .header {
      padding: 10px 14px;
      border-bottom: 1px solid #333;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .status {
      font-size: 12px;
      color: #9cc8ff;
    }
    .messages {
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 78%;
      padding: 8px 10px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .self {
      align-self: flex-end;
      background: #2d5f2f;
    }
    .peer {
      align-self: flex-start;
      background: #2d2d2d;
    }
    .error {
      align-self: flex-start;
      background: #7a1f1f;
    }
    .tool-timeline {
      align-self: flex-start;
      width: min(92%, 720px);
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      background: #242424;
      padding: 8px 10px;
      font-size: 12px;
    }
    .tool-timeline .title {
      color: #d2e3ff;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .tool-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      color: #d0d0d0;
    }
    .tool-phase {
      min-width: 110px;
      color: #8ec7ff;
    }
    .tool-phase.error {
      color: #ff9494;
    }
    .tool-phase.approval {
      color: #ffd48a;
    }
    .composer {
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #333;
      position: relative;
    }
    .composer-controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 0 10px 10px 10px;
      border-top: 1px solid #2b2b2b;
    }
    select {
      border: 1px solid #555;
      border-radius: 8px;
      padding: 8px;
      background: #111;
      color: #f0f0f0;
    }
    .slash-menu {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 88px;
      max-height: 220px;
      overflow: auto;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #181818;
      display: none;
      z-index: 5;
    }
    .slash-item {
      padding: 8px 10px;
      border-bottom: 1px solid #2d2d2d;
      cursor: pointer;
    }
    .slash-item:last-child {
      border-bottom: none;
    }
    .slash-item.active {
      background: #2d3950;
    }
    .slash-name {
      color: #d8e7ff;
      font-weight: 600;
    }
    .slash-desc {
      color: #a8a8a8;
      font-size: 12px;
    }
    textarea {
      resize: none;
      min-height: 56px;
      max-height: 160px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #111;
      color: #f0f0f0;
    }
    button {
      border: 1px solid #555;
      border-radius: 8px;
      padding: 0 14px;
      background: #2b2b2b;
      color: #f0f0f0;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>BlazeClaw Chat (WebView)</div>
      <div id="status" class="status">initializing...</div>
    </div>
    <div id="messages" class="messages"></div>
    <div class="composer">
      <div id="slashMenu" class="slash-menu"></div>
      <textarea id="input" placeholder="Type a message..."></textarea>
      <button id="sendBtn">Send</button>
      <button id="sendErrBtn">Send Error</button>
      <button id="attachBtn">Attach</button>
      <button id="abortBtn" disabled>Abort</button>
    </div>
    <div class="composer-controls">
      <select id="sessionSelect" title="Session"></select>
      <select id="modelSelect" title="Model"></select>
      <select id="thinkingSelect" title="Thinking Level"></select>
    </div>
    <input id="attachInput" type="file" accept="image/*" multiple hidden />
  </div>

  <script src="./scope-errors.js"></script>
  <script src="./agents-controller.js"></script>
  <script src="./chat-controller.js"></script>
  <script src="./chat-events.js"></script>
  <script src="./chat-composer.js"></script>

  <script>
    (() => {
      const state = {
        sessionKey: "main",
        connected: false,
        runId: null,
        streamText: "",
        attachments: [],
        toolTimelineByRequest: new Map(),
        bridgeQueue: [],
        pending: new Map(),
        seenBridgeSeq: new Set(),
        seenBridgeIds: new Set(),
        bridgeAvailable: !!(window.chrome && window.chrome.webview),
      };

      const statusEl = document.getElementById("status");
      const messagesEl = document.getElementById("messages");
      state.inputEl = document.getElementById("input");
      state.sendBtn = document.getElementById("sendBtn");
      state.sendErrBtn = document.getElementById("sendErrBtn");
      state.attachBtn = document.getElementById("attachBtn");
      state.attachInput = document.getElementById("attachInput");
      state.abortBtn = document.getElementById("abortBtn");
      state.sessionSelect = document.getElementById("sessionSelect");
      state.modelSelect = document.getElementById("modelSelect");
      state.thinkingSelect = document.getElementById("thinkingSelect");
      state.slashMenuEl = document.getElementById("slashMenu");

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function scrollBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function addMessage(text, kind) {
        const div = document.createElement("div");
        div.className = `msg ${kind}`;
        div.textContent = text;
        messagesEl.appendChild(div);
        scrollBottom();
      }

      function clearMessages() {
        messagesEl.innerHTML = "";
      }

      function setInputValue(text) {
        if (state.inputEl) {
          state.inputEl.value = String(text || "");
        }
      }

      function ensureToolTimelineCard(requestId) {
        if (!requestId) {
          return null;
        }

        let card = document.getElementById(`tool-card-${requestId}`);
        if (card) {
          return card;
        }

        card = document.createElement("div");
        card.id = `tool-card-${requestId}`;
        card.className = "tool-timeline";

        const title = document.createElement("div");
        title.className = "title";
        title.textContent = `Tool timeline (${requestId})`;
        card.appendChild(title);

        const body = document.createElement("div");
        body.className = "tool-body";
        card.appendChild(body);

        messagesEl.appendChild(card);
        scrollBottom();
        return card;
      }

      function appendToolLifecycleRow(payload) {
        if (!payload || typeof payload !== "object") {
          return;
        }

        const requestId = String(payload.id || "");
        const card = ensureToolTimelineCard(requestId);
        if (!card) {
          return;
        }

        const body = card.querySelector(".tool-body");
        if (!body) {
          return;
        }

        const phase = String(payload.phase || "result");
        const tool = String(payload.tool || "unknown");
        const status = String(payload.status || "");
        const code = String(payload.code || "");

        const row = document.createElement("div");
        row.className = "tool-row";

        const phaseEl = document.createElement("span");
        phaseEl.className = "tool-phase";
        if (phase === "error") {
          phaseEl.classList.add("error");
        }
        if (phase === "approval-needed" || phase === "approval-resolved") {
          phaseEl.classList.add("approval");
        }
        phaseEl.textContent = phase;
        row.appendChild(phaseEl);

        const detailEl = document.createElement("span");
        let detailText = `tool=${tool}`;
        if (status) {
          detailText += ` status=${status}`;
        }
        if (code) {
          detailText += ` code=${code}`;
        }
        detailEl.textContent = detailText;
        row.appendChild(detailEl);

        body.appendChild(row);
        scrollBottom();

        state.toolTimelineByRequest.set(requestId, true);
      }

      function addOrReplaceStream(text) {
        if (!text || controller.isSilentReplyText(text)) {
          return;
        }

        const existing = document.getElementById("stream-msg");
        if (existing) {
          existing.textContent = text;
          scrollBottom();
          return;
        }
        const div = document.createElement("div");
        div.id = "stream-msg";
        div.className = "msg peer";
        div.textContent = text;
        messagesEl.appendChild(div);
        scrollBottom();
      }

      function finalizeStream() {
        const existing = document.getElementById("stream-msg");
        if (existing) {
          existing.removeAttribute("id");
        }
      }

      function updateComposerState() {
        const hasInput = state.inputEl.value.trim().length > 0;
        const hasAttachments = state.attachments.length > 0;
        const canSend = state.bridgeAvailable && (hasInput || hasAttachments);
        state.sendBtn.disabled = !canSend;
        state.sendErrBtn.disabled = !canSend;
        state.abortBtn.disabled = !state.bridgeAvailable || !state.runId;
        state.attachBtn.disabled = !state.bridgeAvailable;
        if (state.sessionSelect) {
          state.sessionSelect.disabled = !state.bridgeAvailable;
        }
        if (state.modelSelect) {
          state.modelSelect.disabled = !state.bridgeAvailable;
        }
        if (state.thinkingSelect) {
          state.thinkingSelect.disabled = !state.bridgeAvailable;
        }
        state.attachBtn.textContent = state.attachments.length > 0
          ? `Attach(${state.attachments.length})`
          : "Attach";
      }
      const controller = window.BlazeClawChatController.createController({
        state,
        addMessage,
        addOrReplaceStream,
        finalizeStream,
        updateComposerState,
        clearMessages,
        setInputValue,
      });

      function resolveAgentsExperimentalEnabled() {
        const search = new URLSearchParams(window.location.search || "");
        if (search.get("agentsExperimental") === "1") {
          return true;
        }

        try {
          if (window.localStorage && window.localStorage.getItem("blazeclaw.agents.experimental") === "1") {
            return true;
          }
        } catch (_) {
        }

        return false;
      }

      const agentsExperimentalEnabled = resolveAgentsExperimentalEnabled();
      const agentsController = agentsExperimentalEnabled && window.BlazeClawAgentsController
        ? window.BlazeClawAgentsController.createAgentsController({
            state,
            request: (method, params) => controller.request(method, params),
            onStateUpdated: () => updateComposerState(),
          })
        : null;

      if (agentsController) {
        state.agentsPanel = "tools";
        state.onSessionChanged = () => {
          agentsController.syncSessionContext({
            sessionKey: state.sessionKey,
          });
          void agentsController.refreshVisibleToolsEffectiveForCurrentSession();
        };
        state.onModelChanged = () => {
          agentsController.syncSessionContext({
            sessionKey: state.sessionKey,
          });
          void agentsController.refreshVisibleToolsEffectiveForCurrentSession();
        };
        agentsController.syncSessionContext({
          sessionKey: state.sessionKey,
        });
      }

      const eventsModule = window.BlazeClawChatEvents.createEventsModule({
        state,
        controller,
        addMessage,
        appendToolLifecycleRow,
        setStatus,
        updateComposerState,
        finalizeStream,
        addOrReplaceStream,
      });

      const composerModule = window.BlazeClawChatComposer.createComposerModule({
        state,
        controller,
        updateComposerState,
      });

      composerModule.bind();
      if (agentsController) {
        void agentsController.loadAgents().then(() => {
          if (state.agentsSelectedId) {
            return agentsController.loadToolsCatalog(state.agentsSelectedId).then(() => {
              return agentsController.refreshVisibleToolsEffectiveForCurrentSession();
            });
          }
          return undefined;
        });
      }

      if (state.bridgeAvailable) {
        window.chrome.webview.addEventListener("message", (event) => {
          eventsModule.handleInboundMessage(event && event.data);
        });

        controller.post({ channel: "blazeclaw.gateway.lifecycle.subscribe" });
        controller.flushQueue();
        setStatus("gateway: subscribing...");
        updateComposerState();
      } else {
        setStatus("bridge unavailable");
        updateComposerState();
      }
    })();
  </script>
</body>
</html>

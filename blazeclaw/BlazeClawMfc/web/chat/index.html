<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlazeClaw Chat</title>
    <link rel="stylesheet" href="./index.css" />
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-title">
                <div>BlazeClaw Chat (WebView)</div>
                <div id="assistantIdentity" class="assistant-identity">A Assistant</div>
                <div id="speechStatus" class="speech-status">speech: loading</div>
            </div>
            <div id="status" class="status">initializing...</div>
        </div>
        <div id="agentsControlPlane" class="agents-control-plane" hidden>
            <div id="agentsTabs" class="agents-tabs"></div>
            <div id="agentsSurface" class="agents-surface"></div>
        </div>
        <div id="approvalQueue" class="approval-queue" hidden></div>
        <div id="messages" class="messages"></div>
        <div id="detachedNotices" class="detached-notices" hidden></div>
        <div class="composer">
            <div id="slashMenu" class="slash-menu"></div>
            <textarea id="input" placeholder="Type a message..."></textarea>
            <button id="sendBtn">Send</button>
            <button id="sendErrBtn">Send Error</button>
            <button id="attachBtn">Attach</button>
            <button id="speechTranscribeBtn">Transcribe</button>
            <button id="abortBtn" disabled>Abort</button>
        </div>
        <div class="composer-controls">
            <select id="sessionSelect" title="Session"></select>
            <select id="modelSelect" title="Model"></select>
            <select id="thinkingSelect" title="Thinking Level"></select>
        </div>
        <div class="session-controls">
            <button id="sessionSubscribeBtn">Subscribe</button>
            <button id="sessionUnsubscribeBtn">Unsubscribe</button>
            <button id="sessionCompactionRefreshBtn">Compactions</button>
            <select id="sessionCompactionSelect" title="Session compactions"></select>
            <div style="display:flex;gap:8px;">
                <button id="sessionCompactionBranchBtn">Branch</button>
                <button id="sessionCompactionRestoreBtn">Restore</button>
            </div>
            <div id="sessionControlStatus" class="session-control-status"></div>
        </div>
        <input id="attachInput" type="file" accept="image/*" multiple hidden />
    </div>

    <script src="./scope-errors.js"></script>
    <script src="./channels-state-contract.js"></script>
    <script src="./config-form-coerce.js"></script>
    <script src="./config-form-utils.js"></script>
    <script src="./agents-controller.js"></script>
    <script src="./chat-controller.js"></script>
    <script src="./chat-events.js"></script>
    <script src="./chat-composer.js"></script>

    <script src="./index.js"></script>
</body>
</html>

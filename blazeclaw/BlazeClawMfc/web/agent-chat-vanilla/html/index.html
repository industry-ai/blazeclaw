<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235B6BFF'/%3E%3Cpath d='M20 24c0-4.4 3.6-8 8-8h8c4.4 0 8 3.6 8 8v6c0 6.6-5.4 12-12 12s-12-5.4-12-12v-6Zm12 28c-7.7 0-14-6.3-14-14h4c0 5.5 4.5 10 10 10s10-4.5 10-10h4c0 7.7-6.3 14-14 14Z' fill='white'/%3E%3C/svg%3E" />
  <title>AgentChat</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .bottom-nav-wrap { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 登录页 -->
    <div id="page-auth" class="page"></div>
    <!-- 聊天页 -->
    <div id="page-chat" class="page"></div>
    <!-- 任务中心页 -->
    <div id="page-tasks" class="page"></div>
    <!-- 工作台页 -->
    <div id="page-ai" class="page"></div>
    <!-- 通知中心页 -->
    <div id="page-notifications" class="page"></div>
    <!-- 个人中心页 -->
    <div id="page-me" class="page"></div>
    <!-- 设备管理页 -->
    <div id="page-devices" class="page"></div>
    <!-- 占位页 -->
    <div id="placeholder-page" class="page">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;background:var(--app-page-bg);color:var(--app-muted);font-size:0.9rem;">
        <div style="text-align:center;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto;color:var(--app-muted);margin-bottom:0.75rem;"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5"/></svg>
          <div id="placeholder-text">功能开发中</div>
        </div>
      </div>
    </div>
    <!-- 底部导航 -->
    <div class="bottom-nav-wrap">
      <div id="bottom-nav" style="display:none;">
        <button class="nav-item active" data-nav="chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <span>会话</span>
          <span id="chat-badge" class="nav-badge" style="display:none;">0</span>
        </button>
        <button class="nav-item" data-nav="tasks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          <span>任务</span>
          <span id="tasks-badge" class="nav-badge" style="display:none;">0</span>
        </button>
        <button class="nav-item" data-nav="ai">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
          <span>工作台</span>
        </button>
        <button class="nav-item" data-nav="notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span>通知</span>
          <span id="notifications-badge" class="nav-badge" style="display:none;">0</span>
        </button>
        <button class="nav-item" data-nav="me">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>我的</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

gateway.bind=127.0.0.1
gateway.port=18789
agent.model=default
agent.streaming=true
chat.ui.mode=webview2

# Generative model
chat.localModel.enabled=true
chat.localModel.provider=llama.cpp
chat.localModel.rolloutStage=dev
#chat.localModel.storageRoot=blazeclaw/BlazeClawMfc/models/chat/Qwen3-14B-ONNX
chat.localModel.storageRoot=blazeclaw/BlazeClawMfc/models/google/gemma-4-E2B-it
chat.localModel.version=
chat.localModel.modelPath=gemma-4-E2B-it.gguf
chat.localModel.modelSha256=
chat.localModel.tokenizerPath=tokenizer.json
chat.localModel.tokenizerSha256=
#chat.localModel.maxTokens=256
chat.localModel.maxTokens=128
chat.localModel.temperature=0.0
chat.localModel.intraThreads=6
chat.localModel.interThreads=1
chat.localModel.executionMode=parallel
chat.localModel.verboseMetrics=true

# Multi-active responders (Step 1: key names/defaults locked)
chat.multiActive.enabled=true
chat.multiActive.threadingMode=thread_pool

# Hard cap for responders scheduled per prompt
# Recommended default: 1 local + up to 3 remotes
chat.multiActive.maxActiveResponders=4

# Shared pool sizing defaults
chat.multiActive.poolMinThreads=2
chat.multiActive.poolMaxThreads=6

# Backpressure and queue controls
chat.multiActive.poolQueueCapacity=128
chat.multiActive.poolDequeueTimeoutMs=50

# Per-responder execution timeout (ms)
chat.multiActive.perResponderTimeoutMs=90000

# Drain timeout when cancelling active pool tasks (ms)
chat.multiActive.cancelDrainTimeoutMs=3000

# Poll/event queue backpressure guard
chat.multiActive.maxQueuedEventsPerSession=1000

# Optional pacing for poll-side reveal to reduce burst pressure
chat.multiActive.pollMinIntervalMs=60
chat.multiActive.pollMaxBatchEvents=50

# Abort policy
chat.multiActive.abortPolicy=cancel_all_children
chat.multiActive.abortWaitForDrain=true

# llama.cpp runtime tuning (Phase 2-3)
# chat.localModel.provider=llama.cpp
# chat.localModel.llama.gpuLayers=999
# chat.localModel.llama.contextLength=8192
# chat.localModel.llama.batchSize=512
# chat.localModel.llama.threads=6
# chat.localModel.llama.flashAttention=true
# chat.localModel.llama.verboseMetrics=true

# Local speech recognition model (wired to Settings dialog -> Feature Model Selection)
# Supported STT roots:
# - BlazeClawMfc/models/STT/qwen3-asr-1.7b-onnx
# - BlazeClawMfc/models/STT/qwen3-asr-0.6b-onnx
# - BlazeClawMfc/models/STT/sherpa-onnx-streaming-zipformer-bilingual-zh-en
# Offline graph optimization command:
# - .\bin\Debug\BlazeClaw.exe --stt-optimize-offline
# Optimized artifacts are resolved automatically from:
# - <speech.storageRoot>/optimized/*.optimized.onnx
# - <speech.storageRoot>/optimized/optimization.metadata.json
# Settings model selection writes speech.storageRoot from the selected catalog model.
# If speech.storageRoot is set to a non-catalog path manually, Settings keeps
# the custom path and shows no catalog model selected.
# On model-selection change, Settings reloads local speech runtime (unload previous,
# then configure/load selected model; on-demand mode remains deferred).
# Sherpa model has its own VAD flow; NVIDIA VAD is not wired for sherpa in this scope.
speech.enabled=false
speech.provider=onnx
speech.storageRoot=BlazeClawMfc/models/STT/qwen3-asr-1.7b-onnx
speech.activeModelId=speech/qwen3-asr-1.7b-onnx
speech.model_path=
# Realtime streaming controls (Phase 6)
speech.streaming.enabled=true
speech.streaming.chunk_ms=500
speech.streaming.lookback_ms=320
speech.streaming.latency_profile=balanced
speech.streaming.preview_chunk_ms=500
speech.streaming.preview_lookback_ms=320
# Backward-compatible aliases (kept for compatibility)
# speech.chunk_ms=1000
# speech.overlap_ms=320

channel=telegram
channel=discord


gateway.bind=127.0.0.1
gateway.port=18789
agent.model=default
agent.streaming=true
chat.ui.mode=webview2
# Note: `chat.mode=native` is compile-time disabled by default via
# BLAZECLAW_ENABLE_NATIVE_CHAT_PATH=0. To use native ChatView path,
# rebuild with BLAZECLAW_ENABLE_NATIVE_CHAT_PATH=1.

blazeclaw.agents.enabled=1

# enum class AgentChatRuntimeMode { Legacy, Native, Auto };
# Step 11 cutover: default to Native while keeping rollback path via Legacy.
agentchat.runtime.mode=Native
agentchat.runtime.bind=127.0.0.1
agentchat.runtime.port=8788
agentchat.runtime.openclawAliases=true
agentchat.runtime.pushChatHost=127.0.0.1
agentchat.runtime.pushChatPort=8765
agentchat.runtime.pushTimeoutMs=30000
agentchat.runtime.runnerChatHost=127.0.0.1
agentchat.runtime.runnerChatPort=8765
agentchat.runtime.stateRoot=
agentchat.runtime.legacyStateRoot=
agentchat.runtime.legacyStateMigrationEnabled=true
native.uiInProcessAgentPath=true
native.httpPushIngress=true
native.openclawAliases=true
native.allowNonLoopbackHttpBind=false
# Step 12 optional deprecation governance: keep Node legacy startup available
# until parity + telemetry approval gates pass.
agentchat.runtime.legacyRollbackEnabled=true
agentchat.runtime.nodeStartupDeprecated=false
agentchat.runtime.nodeRemovalApproved=false

# IRC transport: reconnect backoff + heartbeat (CIrcChatTransport / Connection_c)
# callbackDispatchMode: dispatcher (default worker queue) | caller (sync, tests) | external (injected executor / UI)
agentchat.transport.initialReconnectBackoffMs=1000
agentchat.transport.maxReconnectBackoffMs=30000
agentchat.transport.heartbeatIntervalMs=20000
agentchat.transport.heartbeatStepMs=30000
agentchat.transport.callbackDispatchMode=dispatcher

# Process environment overrides (Windows only). Names must start with BLAZECLAW_ (applied when blazeclaw.conf loads).
# Uncomment for slow local GGUF inference or queue pressure:
env.BLAZECLAW_CHAT_RUNTIME_EXECUTION_TIMEOUT_MS=360000
env.BLAZECLAW_CHAT_RUNTIME_QUEUE_WAIT_TIMEOUT_MS=60000
env.BLAZECLAW_CHAT_RUNTIME_ASYNC_QUEUE_ENABLED=true
env.BLAZECLAW_SHERPA_BASELINE_DIR=BlazeClawRecordings
env.BLAZECLAW_SHERPA_BASELINE_EXPECTED_TEXT=�뽲һ��Ц��
env.BLAZECLAW_SPEECH_LIVE_PREVIEW_ENABLED=false

# Generative model
chat.localModel.enabled=true
chat.localModel.provider=llama.cpp
chat.localModel.rolloutStage=dev
#chat.localModel.storageRoot=blazeclaw/BlazeClawMfc/models/chat/Qwen3-14B-ONNX
chat.localModel.storageRoot=models/google/gemma-4-E2B-it
chat.localModel.version=
chat.localModel.modelPath=model.gguf
chat.localModel.modelSha256=
chat.localModel.tokenizerPath=tokenizer.json
chat.localModel.tokenizerSha256=
#chat.localModel.maxTokens=256
chat.localModel.maxTokens=512
chat.localModel.temperature=0.7
chat.localModel.intraThreads=6
chat.localModel.interThreads=1
chat.localModel.executionMode=parallel
chat.localModel.verboseMetrics=true

# Multi-active responders (Step 1: key names/defaults locked)
chat.multiActive.enabled=true
chat.multiActive.threadingMode=thread_pool

# Hard cap for responders scheduled per prompt
# Recommended default: 1 local + up to 3 remotes
chat.multiActive.maxActiveResponders=4

# Shared pool sizing defaults
chat.multiActive.poolMinThreads=2
chat.multiActive.poolMaxThreads=6

# Backpressure and queue controls
chat.multiActive.poolQueueCapacity=128
chat.multiActive.poolDequeueTimeoutMs=50

# Per-responder execution timeout (ms)
chat.multiActive.perResponderTimeoutMs=90000

# Drain timeout when cancelling active pool tasks (ms)
chat.multiActive.cancelDrainTimeoutMs=3000

# Poll/event queue backpressure guard
chat.multiActive.maxQueuedEventsPerSession=1000

# Optional pacing for poll-side reveal to reduce burst pressure
chat.multiActive.pollMinIntervalMs=60
chat.multiActive.pollMaxBatchEvents=50

# Abort policy
chat.multiActive.abortPolicy=cancel_all_children
chat.multiActive.abortWaitForDrain=true

# startup load defaults to enabled; BLAZECLAW_LOCALMODEL_STARTUP_LOAD_ENABLED can still override when needed

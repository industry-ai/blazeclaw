# Local speech recognition model (wired to Settings dialog -> Feature Model Selection)
# Supported STT roots:
# - BlazeClawMfc/models/STT/qwen3-asr-1.7b-onnx
# - BlazeClawMfc/models/STT/qwen3-asr-0.6b-onnx
# - BlazeClawMfc/models/STT/sherpa-onnx-streaming-zipformer-bilingual-zh-en
# Settings model selection writes speech.storageRoot from the selected catalog model.
# If speech.storageRoot is set to a non-catalog path manually, Settings keeps
# the custom path and shows no catalog model selected.
# On model-selection change, Settings reloads local speech runtime (unload previous,
# then configure/load selected model; on-demand mode remains deferred).
# Sherpa model has its own VAD flow; NVIDIA VAD is not wired for sherpa in this scope.
speech.enabled=true
speech.provider=onnx
speech.storageRoot=BlazeClawMfc/models/STT/sherpa-onnx-streaming-zipformer-bilingual-zh-en
speech.activeModelId=speech/sherpa-onnx-streaming-zipformer-bilingual-zh-en
speech.model_path=
speech.input_device_index=-1
speech.recorder.channels=1
speech.recorder.capture_channel_index=0
speech.recorder.capture_channel_fixed_override=false
speech.recorder.adaptive_capture_channel_enabled=true
speech.recorder.adaptive_capture_decision_frames=2400
speech.recorder.adaptive_capture_min_stable_chunks=3
speech.recorder.adaptive_capture_relock_floor_permille=1
speech.recorder.adaptive_capture_relock_window_frames=1600
speech.cuda.enabled=true
# Optional speech CUDA DLL loading override. Enable to prefer CUDA 12/cuDNN 9
# without relying on global PATH order. DLLs are process-wide by basename; do
# not point this at a conflicting CUDA stack already used by another in-process runtime.
speech.cuda.dll_preload_enabled=true
speech.cuda.dll_directories=D:\nVidia\bin;D:\nVidia\cudnn9.20\bin\12.9\x64
# Leave empty to use BlazeClaw's default CUDA 12/cuDNN 9 preload list.
# speech.cuda.dll_preload_names=cublas64_12.dll,cublasLt64_12.dll,cufft64_12.dll,cudnn64_9.dll,cudnn_graph64_9.dll,cudnn_engines_precompiled64_9.dll,cudnn_engines_runtime_compiled64_9.dll,cudnn_heuristic64_9.dll,cudnn_ops64_9.dll
# Realtime streaming controls (Phase 6)
speech.streaming.enabled=true
# A/B diagnostic bypass for live WebView preview polling. Set to false to keep
# record-then-final-transcribe behavior while disabling interim preview calls.
# Live preview is enabled by default; remove/comment the false override below or
# set it to true, then restart BlazeClaw, to enable preview polling.
# env.BLAZECLAW_SPEECH_LIVE_PREVIEW_ENABLED=false
# env.BLAZECLAW_SPEECH_LIVE_PREVIEW_ENABLED=true
speech.streaming.chunk_ms=500
speech.streaming.lookback_ms=320
speech.streaming.latency_profile=balanced
speech.streaming.preview_chunk_ms=500
speech.streaming.preview_lookback_ms=320
# CPU fallback first-token tuning notes:
# - Generate trial overlays with:
#   tools/speech/New-SherpaCpuFallbackTuningMatrix.ps1
# - Use the same utterances for each trial and summarize captured logs with:
#   tools/speech/Invoke-SherpaProviderBenchmarkSummary.ps1
# - Keep graph optimization enabled and choose CPU settings by first-token and
#   click-to-render latency, not total throughput alone.
# - Current baseline remains 4 threads, sequential execution, 500 ms preview
#   chunk, and 320 ms preview lookback until local benchmark data proves a
#   faster CPU low-latency profile.
# speech.threads=4
# speech.execution_mode=sequential
# Backward-compatible aliases (kept for compatibility)
speech.chunk_ms=1500
speech.overlap_ms=320
# ASR runtime-hot policy: always_online | on_demand | idle_timeout
speech.runtime_hot_mode=always_online
# Used when speech.runtime_hot_mode=idle_timeout
speech.runtime_hot_idle_timeout_ms=300000
# Warmup controls after model load
speech.runtime_hot_warmup_enabled=true
speech.runtime_hot_warmup_runs=1
# ASR hotword/context-biasing controls (wrapper prompt injection, not ONNX file edits)
speech.hotwords_enabled=true
speech.hotwords=����Ϻ
speech.hotwords_max_count=8
# decoder_init | decoder_init_and_step
speech.hotwords_apply_stage=decoder_init
speech.hotwords_debug_dump_prompt=false

name: Arch Checks

on:
  pull_request:
  push:
    branches:
      - main
      - chat

concurrency:
  group: arch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch_checks:
    name: Run architecture fitness checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run arch checks (PowerShell runner)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/arch_checks/run_arch_checks.ps1 -RepoRoot . -Base origin/main -Mode changed

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch_checks_reports
          path: |
            tools/arch_checks/arch_checks_report.json
            tools/arch_checks/file_size_report.json
            tools/arch_checks/boundary_report.json

  arch_checks_audit:
    name: Run architecture fitness checks (audit onboarding)
    runs-on: windows-latest
    needs: arch_checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run arch checks in audit mode (PowerShell runner)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/arch_checks/run_arch_checks.ps1 -RepoRoot . -Base origin/main -Mode changed -Audit

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch_checks_reports_audit
          path: |
            tools/arch_checks/arch_checks_report.json
            tools/arch_checks/file_size_report.json
            tools/arch_checks/boundary_report.json
